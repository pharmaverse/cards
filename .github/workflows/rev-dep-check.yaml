name: Reverse Dep Check

on:
  pull_request:
    branches: [ main ]

# Each reverse dependency is checked out from its GitHub repo at its most recent
# final-release tag (pre-releases excluded; falling back to the default branch
# if it publishes no version tags), the cards from this PR is installed over it,
# and the revdep's test suite is run against that cards. The job fails if any of
# the revdep's tests fail.
#
# This replaced a `checked`-based CRAN-baseline job whose package source
# resolution was persistently unstable, and folds the previously separate crane
# job into the matrix.
jobs:
  revdep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        revdep:
          - ddsjoberg/gtsummary
          - pharmaverse/cardx
          - insightsengineering/crane
    name: ${{ matrix.revdep }}

    steps:
      - name: Checkout cards (this PR)
        uses: actions/checkout@v4
        with:
          path: cards

      - name: Resolve most recent release of ${{ matrix.revdep }}
        id: rev
        run: |
          repo="https://github.com/${{ matrix.revdep }}.git"
          # highest final-release version tag (exclude pre-releases like -rc1)
          tag=$(git ls-remote --tags --refs --sort=-v:refname "$repo" \
                | sed 's#.*refs/tags/##' | grep -E '^v?[0-9]+(\.[0-9]+)+$' | head -n1)
          if [ -z "$tag" ]; then
            tag=$(git ls-remote --symref "$repo" HEAD | awk '/ref:/{sub("refs/heads/","",$2); print $2}')
          fi
          echo "Using ${{ matrix.revdep }}@$tag"
          echo "ref=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout ${{ matrix.revdep }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.revdep }}
          ref: ${{ steps.rev.outputs.ref }}
          path: revdep

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install ${{ matrix.revdep }} dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: revdep
          extra-packages: |
            any::testthat
            any::pkgload
            any::vctrs
          cache-version: 1

      - name: Install cards from this PR
        shell: Rscript {0}
        run: install.packages("./cards", repos = NULL, type = "source")

      - name: Run ${{ matrix.revdep }} tests against this PR's cards
        shell: Rscript {0}
        working-directory: revdep
        run: |
          res <- as.data.frame(
            testthat::test_local(".", stop_on_failure = FALSE, reporter = "summary")
          )
          n_failed <- sum(res$failed)
          cat(sprintf("\n%s: %d failed, %d passed\n", "${{ matrix.revdep }}", n_failed, sum(res$passed)))
          if (n_failed > 0L) {
            print(res[res$failed > 0L, c("file", "test", "failed")])
            stop("Reverse dependency tests failed against this PR's cards")
          }
